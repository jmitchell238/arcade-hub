<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b16" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Arcade Hub" />
  <meta name="description" content="Launch all of your games from one installable arcade home screen." />
  <title>Arcade Hub</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <div id="bgGlow" aria-hidden="true"></div>
  <div id="versionTag"></div>

  <div id="app">
    <header id="topbar">
      <div class="brand">
        <img class="brand-icon" src="icons/icon-192.png" alt="" width="40" height="40" />
        <div class="brand-text">
          <h1>Arcade Hub</h1>
          <p id="tagline">All your games. One place.</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="ghost-btn hidden" type="button" title="Install app">
          <span class="ico">⬇</span> Install
        </button>
      </div>
    </header>

    <main id="main">
      <section id="featured" class="hidden" aria-label="Featured game"></section>

      <section class="section" aria-labelledby="libraryHeading">
        <div class="section-head">
          <h2 id="libraryHeading">Library</h2>
          <span id="gameCount" class="muted"></span>
        </div>
        <div id="filterBar" class="filter-bar" role="tablist" aria-label="Filter games"></div>
        <div id="gameGrid" class="game-grid" role="list"></div>
        <p id="emptyState" class="empty hidden">No games match this filter.</p>
      </section>

      <section id="recentSection" class="section hidden" aria-labelledby="recentHeading">
        <div class="section-head">
          <h2 id="recentHeading">Recently played</h2>
        </div>
        <div id="recentRow" class="recent-row"></div>
      </section>
    </main>

    <footer id="footer">
      <p>Add a game by editing <code>games.json</code> · Install as a PWA for home-screen access</p>
      <p id="versionLine" class="version-line"></p>
    </footer>
  </div>

  <!-- Detail / play sheet -->
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button id="sheetBackdrop" class="sheet-backdrop" type="button" aria-label="Close"></button>
    <div class="sheet-panel">
      <button id="sheetClose" class="sheet-close" type="button" aria-label="Close">✕</button>
      <div id="sheetCover" class="sheet-cover"></div>
      <div class="sheet-body">
        <div id="sheetTags" class="tags"></div>
        <h2 id="sheetTitle"></h2>
        <p id="sheetSub" class="sheet-sub"></p>
        <p id="sheetDesc" class="sheet-desc"></p>
        <button id="playBtn" class="play-btn" type="button">▶  Play</button>
        <a id="openNewTab" class="text-link" href="#" target="_blank" rel="noopener">Open in new tab</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
